# Cloud iOS build for BC Billing (no Mac required).
# Builds the Capacitor iOS shell on Codemagic's Mac instances and uploads to
# App Store Connect / TestFlight automatically.
#
# Before the first run, in the Codemagic UI:
#   1. Connect this GitHub repo.
#   2. Teams → Integrations → App Store Connect → add an API key
#      (App Store Connect → Users and Access → Integrations → generate a key
#       with the "App Manager" role). Name the integration exactly:
#         BC_BILLING_APP_STORE_KEY
#   3. Make sure the bundle id  cloud.bcbilling.app  exists as an App in
#      App Store Connect first (see MOBILE_APP.md).
workflows:
  ios-app-store:
    name: BC Billing iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: BC_BILLING_APP_STORE_KEY
    environment:
      groups:
        # Add a secure variable DIST_CERT_KEY (the fixed distribution signing
        # key) to a Codemagic variable group named exactly "ios_signing".
        - ios_signing
      vars:
        # Capacitor 8 uses Swift Package Manager (no CocoaPods / no .xcworkspace).
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "cloud.bcbilling.app"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install
      - name: Generate the iOS native project
        script: |
          set -e
          # A fresh clone has no ios/ — scaffold it. Capacitor 8 wires up Swift
          # Package Manager, so there are no pods to install.
          if [ ! -d "ios/App" ]; then npx cap add ios; fi
          npx cap sync ios
          # Generate the real app icon + splash from assets/ into the iOS
          # project, replacing Capacitor's default placeholder icon (App Store
          # guideline 2.3.8). Non-fatal if the tool changes its flags.
          npx @capacitor/assets generate --ios --assetPath assets || \
            npx @capacitor/assets@latest generate --ios || true
          # Force the Xcode target's bundle id to match the provisioning profile
          # we create for $BUNDLE_ID, so use-profiles can bind them.
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" \
            ios/App/App.xcodeproj/project.pbxproj
          echo "Bundle ids now set to:"
          grep PRODUCT_BUNDLE_IDENTIFIER ios/App/App.xcodeproj/project.pbxproj || true
          # Bump the build number above any previously uploaded build. Apple
          # requires CFBundleVersion to increase on every upload, but a freshly
          # scaffolded project always resets it to 1. Use a unix timestamp, which
          # is numeric and always increases, so each build uploads cleanly.
          BUILD_NUM="$(date +%s)"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUM};/g" \
            ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUM}" ios/App/App/Info.plist 2>/dev/null || true
          echo "Build number (CFBundleVersion) set to ${BUILD_NUM}"
      - name: Set up code signing (create cert + profile if missing)
        script: |
          set -e
          keychain initialize
          # Reuse ONE fixed distribution key across every build. With a stable
          # key, fetch-signing-files finds the certificate it created the first
          # time and reuses it — so we never create a new certificate each run
          # (Apple caps distribution certs at 2, which is what kept failing).
          # The key is provided as the secure env var DIST_CERT_KEY; if it's not
          # set we fall back to generating one (first-time / local use).
          CERT_KEY="$CM_BUILD_DIR/dist_cert_key.pem"
          if [ -n "$DIST_CERT_KEY" ]; then
            printf '%s\n' "$DIST_CERT_KEY" > "$CERT_KEY"
          else
            openssl genrsa -out "$CERT_KEY" 2048
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$CERT_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build the signed .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Just upload the build to App Store Connect. We do NOT auto-submit to
        # TestFlight external testing (that needs beta-tester info we don't use
        # and was failing the step), nor auto-submit to App Store review — the
        # build is selected and submitted for review manually in App Store
        # Connect.
        submit_to_testflight: false
        submit_to_app_store: false
